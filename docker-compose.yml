version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: adaptive-tutor-postgres
    environment:
      POSTGRES_DB: adaptive_tutor
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: adaptive-tutor-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest
    container_name: adaptive-tutor-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # freellmapi - optional, deploy separately
  # See: https://github.com/tashfeenahmed/freellmapi

volumes:
  postgres_data:
  qdrant_data:
  clamav_data:
