# Правила репозитория и контракт API. Быстрый прогон без зависимостей приложения.
name: rules

permissions:
  contents: read

on:
  push:
    branches: [dev, main, 'features/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: правила и контракт
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      - name: Правила репозитория
        run: python scripts/check_repo_rules.py

      - name: Секреты в исходниках
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . -c .gitleaks.toml --no-banner --redact --exit-code 1

      - name: Контракт API (пути фронта)
        run: python scripts/check_api_contract.py

      - name: Контракт API (типы фронта)
        run: python scripts/check_contract_types.py
