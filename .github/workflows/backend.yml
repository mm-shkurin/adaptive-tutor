# Бэкенд: миграции, тесты против Postgres + Redis.
name: backend

permissions:
  contents: read

on:
  push:
    branches: [dev, main, 'features/**']
    paths:
      - 'backend/**'
      - 'infra/.env.example'
      - 'infra/docker/backend.Dockerfile'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'infra/.env.example'
      - 'infra/docker/backend.Dockerfile'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  tests:
    name: миграции и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: absolute
          POSTGRES_PASSWORD: absolute
          POSTGRES_DB: adaptive_tutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U absolute -d adaptive_tutor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Зависимости
        run: |
          pip install -r requirements.txt
          pip install pytest-cov diff-cover

      - name: Конфигурация
        run: |
          cp ../infra/.env.example .env
          {
            echo "DATABASE_URL=postgresql+asyncpg://absolute:absolute@localhost:5432/adaptive_tutor"
            echo "REDIS_URL=redis://localhost:6379/0"
            echo "OAUTH_PROVIDER=fake"
            echo "JWT_ACCESS_SECRET=ci-access-secret-not-used-elsewhere-000000"
            echo "JWT_REFRESH_SECRET=ci-refresh-secret-not-used-elsewhere-0000"
            echo "OAUTH_FRONTEND_CALLBACK_URL=http://localhost:5173/auth/callback"
            echo "PUBLIC_BASE_URL=http://localhost:8000"
            echo "CORS_ORIGINS=http://localhost:5173"
            echo "QDRANT_URL=http://localhost:6333"
            echo "FREE_LLM_API_URL=http://localhost:3001/v1"
            echo "FREE_LLM_API_KEY=ci-placeholder"
          } >> .env

      - name: Миграции
        run: alembic upgrade head

      - name: Откат последней ревизии и повтор
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: Тесты и покрытие
        run: >-
          python -m pytest
          --cov=domain --cov=usecase --cov=adapters --cov=application
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Покрытие изменений
        if: github.ref_name != 'main'
        run: |
          git fetch --no-tags --depth=1 origin dev || true
          diff-cover coverage.xml --compare-branch=origin/dev --fail-under=60 \
            --markdown-report "$GITHUB_STEP_SUMMARY" || true
        # soft until coverage baseline is healthy; remove `|| true` when ready to enforce

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov
          retention-days: 7

  image:
    name: сборка образа
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Сборка backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
