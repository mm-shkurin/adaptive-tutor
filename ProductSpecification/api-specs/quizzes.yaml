openapi: 3.0.3
info:
  title: Quizzes of the signed-in person
  version: 1.0.0
  description: |
    Викторина по одному готовому PDF. Один вызов freellmapi при создании.
    Повтор и продолжение читают только хранилище. Оценка — по сохранённому
    верному варианту. Цитата — страница PDF из найденного куска.

paths:
  /api/v1/quizzes:
    get:
      summary: Список своих викторин
      operationId: listQuizzes
      tags: [quizzes]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: |
            Свои викторины, сначала новые. При равном времени создания выше тот,
            чей id больше. Не больше 100 строк. Чужая викторина в список не входит.
            last_score — последний завершённый счёт или null. Открытый заход счёт
            карточки не меняет.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizList' }
        '404':
          description: |
            Сессии нет или хранилище сессий недоступно.
            code quiz_not_found и то же message, что у отсутствующей викторины.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    post:
      summary: Создать викторину и начать прохождение
      operationId: createQuiz
      tags: [quizzes]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuiz' }
      responses:
        '201':
          description: |
            Викторина сохранена. Открыт заход на первом вопросе. В теле — то же,
            что GET по id в состоянии take. Повтор того же Idempotency-Key
            возвращает ту же викторину без второго вызова модели.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizDetail' }
        '400':
          description: |
            code empty_topic — тема пустая после trim или длиннее 200.
            code invalid_question_count — не 3, 5 или 8 (в т.ч. null).
            code no_ready_document — готового PDF нет.
            code document_not_ready — свой документ не ready.
            code empty_retrieval — по теме кусков нет.
            code generation_failed — ответ модели не той формы, таймаут или
            ошибка канала. Ничего не сохранено.
            message без текста файла, чужих данных, секрета, стека и пути.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            Сессии нет, документ отсутствует или чужой, либо сессия недоступна.
            code quiz_not_found и одно message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/quizzes/{id}:
    get:
      summary: Своя викторина с заходом или результатом
      operationId: getQuiz
      tags: [quizzes]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          description: |
            Своя викторина. status=take — есть открытый заход (в т.ч. продолжение
            с сохранённым выбором и страницей на текущем вопросе).
            status=result — открытого захода нет и есть последний завершённый
            счёт (карточка без открытого захода открывает этот результат).
            До выбора на текущем вопросе page и correct_choice_id не отдаются.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizDetail' }
        '404':
          description: |
            Сессии нет, викторины нет или викторина чужая.
            code quiz_not_found и одно message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/quizzes/{id}/answers:
    post:
      summary: Ответить на текущий вопрос открытого захода
      operationId: answerQuizQuestion
      tags: [quizzes]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/QuizId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerQuiz' }
      responses:
        '200':
          description: |
            Выбор записан. В ответе — разбор: верно ли, page, correct_choice_id.
            Повторный выбор на том же вопросе не меняет оценку и возвращает
            уже записанный разбор.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizDetail' }
        '400':
          description: |
            code no_open_attempt — открытого захода нет (уже результат).
            code invalid_choice — choice_id не из четырёх вариантов текущего вопроса.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            Сессии нет, викторины нет или викторина чужая. code quiz_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/quizzes/{id}/advance:
    post:
      summary: Далее или завершить после ответа
      operationId: advanceQuiz
      tags: [quizzes]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          description: |
            Текущий вопрос уже отвечен. Не последний — следующий вопрос.
            Последний — status=result, last_score обновлён, открытого захода нет.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizDetail' }
        '400':
          description: |
            code no_open_attempt — открытого захода нет.
            code unanswered — на текущем вопросе ещё нет выбора.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            Сессии нет, викторины нет или викторина чужая. code quiz_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/quizzes/{id}/retries:
    post:
      summary: Пройти ещё раз с тех же вопросов
      operationId: retryQuiz
      tags: [quizzes]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          description: |
            Новый открытый заход с первого вопроса. Модель не вызывается.
            last_score карточки остаётся прежним, пока новый заход не завершён.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizDetail' }
        '404':
          description: |
            Сессии нет, викторины нет или викторина чужая. code quiz_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session
  parameters:
    QuizId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message:
          type: string
          description: Без текста файла, чужих данных, секрета, стека и пути.
    CreateQuiz:
      type: object
      required: [document_id, topic]
      additionalProperties: false
      properties:
        document_id: { type: string, format: uuid }
        topic:
          type: string
          minLength: 1
          maxLength: 200
          description: После trim не пустая. Язык темы = язык вопросов и вариантов.
        question_count:
          type: integer
          enum: [3, 5, 8]
          description: Если поле отсутствует — 5. null запрещён.
    AnswerQuiz:
      type: object
      required: [choice_id]
      additionalProperties: false
      properties:
        choice_id:
          type: string
          description: Id одного из четырёх вариантов текущего вопроса.
    QuizList:
      type: object
      required: [quizzes]
      properties:
        quizzes:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/QuizCard' }
    QuizCard:
      type: object
      required: [id, document_id, document_name, topic, question_count, last_score]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_name: { type: string }
        topic: { type: string }
        question_count: { type: integer, enum: [3, 5, 8] }
        last_score:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Score'
          description: Последний завершённый счёт или null.
    Score:
      type: object
      required: [correct, total]
      properties:
        correct: { type: integer, minimum: 0 }
        total: { type: integer, enum: [3, 5, 8] }
    QuizDetail:
      type: object
      required:
        - id
        - document_id
        - document_name
        - topic
        - question_count
        - status
        - last_score
        - questions
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_name: { type: string }
        topic: { type: string }
        question_count: { type: integer, enum: [3, 5, 8] }
        status:
          type: string
          enum: [take, result]
        last_score:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Score'
        current_index:
          type: integer
          minimum: 0
          description: Индекс текущего вопроса при status=take. Иначе отсутствует.
        questions:
          type: array
          minItems: 3
          maxItems: 8
          items: { $ref: '#/components/schemas/Question' }
    Question:
      type: object
      required: [id, text, choices]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        choices:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/Choice' }
        chosen_choice_id:
          type: string
          nullable: true
          description: Выбор человека на этом вопросе, если уже отвечал.
        correct_choice_id:
          type: string
          nullable: true
          description: |
            Верный вариант. null, пока на этом вопросе нет выбора и status=take.
            На result всегда задан.
        correct:
          type: boolean
          nullable: true
          description: null, пока нет выбора.
        page:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Страница куска. null, пока на этом вопросе нет выбора и status=take.
            На result задан для PDF и pdf_page-слайдов; null для чисто слайдовых кусков.
        slide:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Позиция слайда в презентации. null для обычного PDF и до ответа при status=take.
    Choice:
      type: object
      required: [id, text]
      properties:
        id: { type: string }
        text: { type: string }
