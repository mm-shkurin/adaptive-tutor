openapi: 3.0.3
info:
  title: PDF documents of the signed-in person
  version: 1.0.0
  description: |
    Загрузка PDF, список и статус. Ответ не ждёт индексации.
    Куски и исходный файл наружу не отдаются.

paths:
  /api/v1/documents:
    get:
      summary: Список своих документов
      operationId: listDocuments
      tags: [documents]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
          description: |
            Смещение страницами по 50. Игнорируется, если передан after.
        - name: after
          in: query
          schema: { type: string, format: uuid }
          description: |
            Keyset: документы строго старше этой строки (created_at, id),
            сначала новые. Для следующей страницы после живой вставки.
      responses:
        '200':
          description: |
            Не больше 50 документов, сначала новые. Пустая страница — пустой список.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentPage' }
        '404':
          description: |
            Сессии нет. code document_not_found и то же message, что у отсутствующего документа.
            Список не отдаётся.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    post:
      summary: Загрузить PDF
      operationId: uploadDocument
      tags: [documents]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
          description: |
            Один ключ — один документ, в том числе когда два запроса пересекаются.
            Повтор не тратит место в пяти загрузках за минуту.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    PDF от 1048576 до 52428800 байт включительно.
                    Имя файла — 1–255 графемных кластеров после NFC, без обрезки посередине буквы.
                    Поля id, owner, status, page_count, piece_count и error из формы не читаются.
      responses:
        '201':
          description: |
            Документ создан, статус waiting. Индексация ещё не кончилась.
            Следующий список уже содержит эту строку.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '200':
          description: Этот Idempotency-Key уже принят. Тело — тот же документ, новым он не становится.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400':
          description: |
            Отказ до строки. code один из: file_missing, invalid_pdf, empty_pdf,
            file_too_small, file_too_large, name_missing, name_too_long,
            encrypted_pdf, virus_detected.
            virus_detected также на таймаут и нечитаемый ответ проверки.
            message без текста файла, чужих данных, секрета, стека и пути.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            Сессии нет. code document_not_found и то же message, что у отсутствующего документа.
            Строка не создаётся.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            Шестой принятый файл за эту минуту: code rate_limited.
            Счётчик не прочитался: code rate_unavailable.
            Уже принятые пять остаются. Повтор своего ключа сюда не попадает.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/documents/status-events:
    get:
      summary: Поток статусов своих документов (SSE)
      operationId: documentStatusEvents
      tags: [documents]
      security: [{ bearerAuth: [] }]
      description: |
        Session-scoped Server-Sent Events. Same auth as the list.
        On connect the server first emits each document from the newest page
        (catch-up), then pushes a document-status event whenever an owned
        document's status row changes (waiting → indexing → ready|failed).
        Event name: document-status. Data is a Document object.
        Keepalive comments may appear while idle. The list GET stays for the
        initial page only; clients must not poll the list for status once
        this stream is available.
      responses:
        '200':
          description: |
            text/event-stream of document-status events.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames. Each status event:
                  event: document-status
                  data: Document JSON
        '404':
          description: |
            Сессии нет. code document_not_found и то же message, что у отсутствующего документа.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/documents/{id}:
    get:
      summary: Один свой документ
      operationId: getDocument
      tags: [documents]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Документ вошедшего. Статус waiting, indexing, ready или failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404':
          description: |
            Нет сессии, нет такого id или документ чужой.
            code document_not_found и одно и то же message во всех трёх случаях.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    Document:
      type: object
      required: [id, name, kind, size_bytes, page_count, piece_count, status, error]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [pdf, presentation]
          description: |
            pdf — обычная загрузка истории 2.
            presentation — строка презентации (история 3); size_bytes может быть 0 у draft.
        name:
          type: string
          minLength: 1
          description: |
            Имя файла после NFC (pdf) или название презентации.
            PDF: лимит 255 графемных кластеров. Презентация: до 80 символов.
            Показано как текст, не как разметка.
        size_bytes:
          type: integer
          minimum: 0
          maximum: 52428800
          description: |
            PDF: ровно столько байт, сколько приняли (минимум 1048576 при upload).
            presentation: 0 у draft; иначе сумма принятых байт слайдов до стирания.
        page_count:
          type: integer
          nullable: true
          minimum: 0
          description: |
            PDF: null, пока страницы не прочитаны.
            presentation: число слайдов (синоним slide_count на списке), null до первого сохранения слайдов не требуется — 0 допустим.
        piece_count:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2000
          description: Число только у ready. Иначе null. У failed кусков в поиске нет.
        status:
          type: string
          enum: [draft, waiting, indexing, ready, failed]
          description: |
            PDF: waiting → indexing → ready|failed (draft не используется).
            presentation: draft → waiting → indexing → ready|failed.
        error:
          type: string
          nullable: true
          description: |
            null, пока документ не failed. У ready всегда null.
            У failed — причина для строки, без текста файла и без внутреннего пути.
    DocumentPage:
      type: object
      required: [documents, has_next]
      properties:
        documents:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Document' }
        has_next: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message:
          type: string
          description: Без текста файла, чужих данных, секрета, стека и пути.
